# =============================================================================
#  Plateforme « Gestion des commandes » - 5 conteneurs Windows.
#
#  A lancer sur le serveur, depuis C:\microservices\app :
#      Copy-Item .env.example .env     # puis renseigner les deux secrets
#      docker compose up -d --build
#
#  Seule la gateway est publiee sur l'hote (port 80). Les quatre services ne sont
#  joignables que par leur nom DNS sur le reseau Docker « microservices ».
#  Chaque service a sa propre base SQLite, dans un sous-dossier de MICRO_DATA_ROOT.
# =============================================================================
name: gestion-commandes

# --- Reglages communs, repris par alias YAML (*nom) --------------------------
x-images: &images
  SDK_IMAGE: ${SDK_IMAGE}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE}

x-environnement: &environnement
  ASPNETCORE_ENVIRONMENT: Production
  # Cle de signature des jetons : la MEME pour tous, sinon les services ne
  # peuvent pas valider les jetons emis par identity-service.
  Jwt__Key: ${JWT_KEY}
  # Cle des appels entre conteneurs. La gateway la supprime des requetes entrantes.
  Internal__ApiKey: ${INTERNAL_API_KEY}
  Services__Identity: http://identity-service:8080
  Services__Catalog: http://catalog-service:8080
  Services__Order: http://order-service:8080
  Services__Delivery: http://delivery-service:8080

# Sonde des services : « ready » verifie aussi que la base SQLite repond.
x-sonde: &sonde
  test: ["CMD", "curl.exe", "-f", "http://localhost:8080/health/ready"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

services:
  # --- 1. Comptes et jetons --------------------------------------------------
  identity-service:
    image: gestion-commandes/identity-service:1.0
    build:
      context: .
      dockerfile: src/IdentityService/Dockerfile
      args: *images
    restart: always
    networks: [microservices]
    environment: *environnement
    healthcheck: *sonde
    volumes:
      - ${MICRO_DATA_ROOT}\identity-service:C:\app\data

  # --- 2. Catalogue et stock -------------------------------------------------
  catalog-service:
    image: gestion-commandes/catalog-service:1.0
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
      args: *images
    restart: always
    networks: [microservices]
    environment: *environnement
    healthcheck: *sonde
    volumes:
      - ${MICRO_DATA_ROOT}\catalog-service:C:\app\data

  # --- 3. Commandes (pilote catalog-service et delivery-service) -------------
  order-service:
    image: gestion-commandes/order-service:1.0
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
      args: *images
    restart: always
    networks: [microservices]
    environment: *environnement
    healthcheck: *sonde
    volumes:
      - ${MICRO_DATA_ROOT}\order-service:C:\app\data

  # --- 4. Livraisons et notifications ----------------------------------------
  delivery-service:
    image: gestion-commandes/delivery-service:1.0
    build:
      context: .
      dockerfile: src/DeliveryService/Dockerfile
      args: *images
    restart: always
    networks: [microservices]
    environment: *environnement
    healthcheck: *sonde
    volumes:
      - ${MICRO_DATA_ROOT}\delivery-service:C:\app\data

  # --- 5. Gateway : interface web + routage + authentification ---------------
  gateway:
    image: gestion-commandes/gateway:1.0
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
      args: *images
    restart: always
    networks: [microservices]
    environment: *environnement
    # La gateway n'a pas de base : on verifie seulement que le processus repond.
    healthcheck:
      test: ["CMD", "curl.exe", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Les quatre services doivent etre prets avant d'ouvrir le port public :
    # c'est la seule dependance de demarrage de toute la plateforme.
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    ports:
      - ${HTTP_PORT:-80}:8080
    volumes:
      - ${MICRO_DATA_ROOT}\gateway:C:\app\data

networks:
  # Driver « nat » : le reseau par defaut des conteneurs Windows. La resolution
  # par nom de service est assuree par le serveur DNS interne de Docker.
  microservices:
    driver: nat
