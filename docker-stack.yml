      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    volumes:
    - C:\microservices\data\notification-service:C:\app\data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      placement:
