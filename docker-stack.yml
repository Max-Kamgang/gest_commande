# =============================================================================
# docker-stack.yml - BONUS : deploiement en mode Swarm (overlay).
#
# Pre-requis : Swarm initialise sur SRV-MICRO-01 (docker swarm init), images construites
# sur le noeud (docker compose build) ou publiees dans un registre accessible.
#   docker stack deploy -c docker-stack.yml gestion
#
# catalog-service est replique 2 fois (consigne du projet). Limite connue, documentee
# dans docs/architecture.md : les deux repliques partagent le fichier SQLite de catalog
# via le bind mount ; c'est acceptable pour une charge de lecture et un seul noeud, pas
# pour une production multi-noeuds (il faudrait un SGBD reseau, hors contraintes Linux).
# =============================================================================
services:
  identity-service:
    image: gestion-commandes/identity-service:1.0
    networks:
    - microservices
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY}
      Internal__ApiKey: ${INTERNAL_API_KEY}
      Serilog__MinimumLevel__Default: ${SERILOG_LEVEL:-Information}
      Services__Identity: http://identity-service:8080
      Services__Catalog: http://catalog-service:8080
      Services__Inventory: http://inventory-service:8080
      Services__Order: http://order-service:8080
      Services__Delivery: http://delivery-service:8080
      Services__Notification: http://notification-service:8080
    healthcheck:
      test:
      - CMD
      - curl.exe
      - -f
      - http://localhost:8080/health/ready
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    volumes:
    - C:\microservices\data\identity-service:C:\app\data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      placement:
        constraints:
        - node.platform.os == windows
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
  notification-service:
    image: gestion-commandes/notification-service:1.0
    networks:
    - microservices
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY}
      Internal__ApiKey: ${INTERNAL_API_KEY}
